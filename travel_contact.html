
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Go Places and Do Things</title>
        <link rel="stylesheet" href="./travel_recommendation.css">
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        />
        </head>
    <body>
        <nav><h1>Go Places and Do Things</h1>
            <input type="checkbox" id="navToggle" class="nav-toggle">
            <label for="navToggle" class="nav-hamburger"><span></span></label>
            <ul>
                <li><a href="./travel_recommendation.html" id="home">Home </a></li>
                <li><a href="./travel_about.html" id="about">About Us </a></li>
                <li><a href="./travel_contact.html" id="contact">Contact Us </a></li>
            </ul>
        </nav>
        <div class="page">
            <div class="contactMsg">
                <h1>Contact Us</h1>
                <p>Please let us know how we're doing!</p>
                <p>Note: this isn't going to actually go anywhere, but
                    if you want to see some of my other work or get in touch with me,
                    go to <a href="https://github.com/King-Forge" target="_blank">https://github.com/King-Forge</a></p>
                <form id="contactForm">
                    <div>
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div>
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div>
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>
                    <button type="submit" id="submitBtn">Submit</button>
                </form>
            </div>
            <div class="socials">
                <a href="https://x.com" target="_blank">
                    <i class="fa-brands fa-x-twitter"></i>
                </a>

                <a href="https://facebook.com" target="_blank">
                    <i class="fa-brands fa-facebook"></i>
                </a>

                <a href="https://instagram.com" target="_blank">
                    <i class="fa-brands fa-instagram"></i>
                </a>
                <a href="https://youtube.com" target="_blank">
                    <i class="fa-brands fa-youtube"></i>
                </a>
            </div>
        </div>
        <script src="./travel_contact.js"></script>
    </body>
</html>
